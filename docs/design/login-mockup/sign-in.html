<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R5 Operating System – Sign in Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  margin: 0;
  background: #1e293b;
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  color: #141414;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 24px;
}
.desktop-viewport {
  width: 1190px;
  height: 770px;
  position: relative;
  overflow: hidden;
  background: #c9dbf6;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
  border-radius: 8px;
}
button {
  font-family: inherit;
  cursor: pointer;
}
/* BeOS Tab */
.window-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 26px;
  padding: 0 16px 0 8px;
  background: #f8cc26;
  border: 1px solid #a88200;
  border-bottom: none;
  font-size: 13px;
  font-weight: 700;
  user-select: none;
  border-top-left-radius: 4px;
  border-top-right-radius: 4px;
}
.tab-close-box {
  width: 11px;
  height: 11px;
  background: #ffe88a;
  border: 1px solid #a88200;
}
.tab-zoom-box {
  position: relative;
  width: 14px;
  height: 13px;
}
.tab-zoom-outer {
  position: absolute;
  left: 0;
  top: 0;
  width: 9px;
  height: 8px;
  background: #ffe88a;
  border: 1px solid #a88200;
}
.tab-zoom-inner {
  position: absolute;
  left: 4px;
  top: 4px;
  width: 9px;
  height: 8px;
  background: #ffe88a;
  border: 1px solid #a88200;
}
/* Window Frame */
.window-frame {
  width: 440px;
  background: #ededed;
  border: 1px solid #8c8c8c;
  box-shadow: inset 1px 1px 0 #ffffff, 0 24px 48px rgba(15,23,42,0.22), 0 6px 16px rgba(15,23,42,0.1);
  border-bottom-left-radius: 6px;
  border-bottom-right-radius: 6px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
/* BeOS Buttons */
.beos-btn {
  height: 32px;
  padding: 0 12px;
  background: #f6f6f6;
  border: 1px solid #b5b5b5;
  box-shadow: inset 1px 1px 0 #ffffff;
  border-radius: 3px;
  color: #141414;
  font-size: 12.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.1s, border-color 0.1s;
}
.beos-btn:hover {
  background: #eaeaea;
  border-color: #999999;
}
.beos-btn:active {
  background: #dedede;
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.15);
}
/* Primary Button */
.primary-btn {
  height: 38px;
  background: #0084ff;
  border: 1px solid #0070db;
  border-radius: 4px;
  color: #ffffff;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 1px 2px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.12s;
  width: 100%;
}
.primary-btn:hover {
  background: #0077e6;
}
.primary-btn:active {
  background: #0066cc;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
}
/* User cards */
.user-option {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: #f8fafc;
  border: 1px solid #dbe3ef;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.user-option:hover {
  background: #f1f5f9;
  border-color: #cbd5e1;
}
.user-option.active {
  background: #ffffff;
  border-color: #0084ff;
  box-shadow: 0 0 0 2px rgba(0,132,255,0.15), 0 2px 4px rgba(15,23,42,0.06);
}
/* Input styles */
.input-wrapper {
  display: flex;
  align-items: center;
  height: 38px;
  background: #ffffff;
  border: 1px solid #aaaaaa;
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.08);
  border-radius: 4px;
  padding: 0 10px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input-wrapper:focus-within {
  border-color: #0084ff;
  box-shadow: 0 0 0 2px rgba(0,132,255,0.22), inset 1px 1px 2px rgba(0,0,0,0.08);
}
.text-input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  color: #141414;
}
.eye-toggle-btn {
  background: transparent;
  border: none;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.65;
  transition: opacity 0.1s;
  cursor: pointer;
}
.eye-toggle-btn:hover {
  opacity: 1;
}
/* Feedback message */
.feedback-msg {
  min-height: 18px;
  font-size: 12.5px;
  text-align: center;
  color: #64748b;
  transition: color 0.15s;
}
.feedback-msg.error {
  color: #e11d48;
  font-weight: 600;
}
.feedback-msg.success {
  color: #059669;
  font-weight: 600;
}
/* Dialog Toast */
.action-toast {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f172a;
  color: #ffffff;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  display: none;
  align-items: center;
  gap: 8px;
  z-index: 1000;
}
</style>
</head>
<body>

<div class="desktop-viewport">
  <!-- Desktop Background Wave -->
  <svg aria-hidden="true" width="1190" height="770" viewBox="0 0 1190 770" style="position: absolute; left: 0; top: 0">
    <path d="M0,250 C220,190 420,250 620,330 C820,410 1000,420 1190,380 L1190,770 L0,770 Z" fill="#a9c4f0"></path>
    <path d="M0,450 C260,400 470,470 700,560 C900,640 1060,640 1190,610 L1190,770 L0,770 Z" fill="#86a8e6"></path>
  </svg>

  <!-- Desktop Icon: R5 Disk -->
  <div style="position: absolute; left: 34px; top: 30px; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; user-select: none;">
    <svg aria-hidden="true" width="58" height="46" viewBox="0 0 58 46">
      <path d="M4,22 L29,10 L54,22 L54,30 L29,42 L4,30 Z" fill="#d7dbe0" stroke="#6b7280"></path>
      <path d="M4,22 L29,34 L54,22" fill="none" stroke="#6b7280"></path>
      <path d="M29,34 L29,42" stroke="#6b7280"></path>
      <circle cx="31" cy="17" r="9" fill="#0084ff"></circle>
      <path d="M33,12 C29,12 28,15 30,18 C31,20 30,22 27,23 C31,24 36,22 36,17 C36,14 35,12 33,12 Z" fill="#ffffff"></path>
    </svg>
    <span style="font-size: 12px; font-weight: 700; color: #ffffff; text-shadow: 0 1px 2px rgba(15,23,42,0.45)">R5</span>
  </div>

  <!-- Deskbar Tray (Top Right) -->
  <div style="position: absolute; right: 18px; top: 14px; width: 172px; height: 30px; box-sizing: border-box; background: #e9e9e9; border: 1px solid #8c8c8c; box-shadow: inset 1px 1px 0 #ffffff; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; user-select: none;">
    <span style="width: 26px; height: 22px; background: #f6f6f6; border: 1px solid #b5b5b5; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#0084ff"></circle><path d="M54,24 C42,24 37,32 43,42 C49,51 46,62 35,66 C26,69 27,77 41,77 C64,77 77,64 77,48 C77,33 66,24 54,24 Z" fill="#ffffff"></path></svg>
    </span>
    <span style="width: 1px; height: 20px; background: #b5b5b5"></span>
    <span style="flex: 1"></span>
    <span id="deskbarClock" style="font-size: 12px; font-weight: 700">14:30</span>
  </div>

  <!-- Centered Sign-in Window -->
  <div style="position: absolute; left: 375px; top: 110px;">
    <!-- Yellow BeOS Tab -->
    <div class="window-tab">
      <div class="tab-close-box" title="Close"></div>
      <span>Sign in</span>
      <span style="width: 28px"></span>
      <div class="tab-zoom-box" title="Zoom">
        <div class="tab-zoom-outer"></div>
        <div class="tab-zoom-inner"></div>
      </div>
    </div>

    <!-- Window Body Frame -->
    <div class="window-frame">
      <!-- Header Banner / System Branding -->
      <div style="background: #ffffff; border: 1px solid #c4c4c4; border-radius: 6px; padding: 14px 16px; display: flex; align-items: center; gap: 14px;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #f0f7ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,132,255,0.18);">
          <img src="icons/r5-symbol.svg" alt="R5 Operating System" width="36" height="36">
        </div>
        <div>
          <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2">Welcome to R5</div>
          <div style="font-size: 12.5px; color: #475569; margin-top: 2px">Sign in to start your session</div>
        </div>
      </div>

      <!-- Account Selection (Multi-User) -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 11.5px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.04em;">Select Person</div>
        <div style="display: flex; gap: 8px;">
          <!-- User 1: Administrator (user) -->
          <div id="userCard1" class="user-option active" onclick="selectUser('user', 'User', 'Administrator', 'userCard1')">
            <div style="width: 38px; height: 38px; border-radius: 50%; background: #e0f2fe; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid #bae6fd;">
              <img src="icons/people.svg" alt="" width="30" height="30">
            </div>
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span style="font-size: 13px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</span>
              <span style="font-size: 11px; color: #0284c7; font-weight: 600;">Administrator</span>
            </div>
          </div>

          <!-- User 2: Standard (guest) -->
          <div id="userCard2" class="user-option" onclick="selectUser('guest', 'Guest', 'Standard user', 'userCard2')">
            <div style="width: 38px; height: 38px; border-radius: 50%; background: #f1f5f9; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid #e2e8f0;">
              <img src="icons/people.svg" alt="" width="30" height="30" style="filter: grayscale(80%); opacity: 0.75;">
            </div>
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span style="font-size: 13px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Guest</span>
              <span style="font-size: 11px; color: #64748b; font-weight: 500;">Standard</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Credential Form Card -->
      <div style="background: #ffffff; border: 1px solid #c4c4c4; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <!-- Active User Badge Display -->
        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 12px; color: #64748b;">Signing in as:</span>
            <span id="activeUserName" style="font-size: 13px; font-weight: 700; color: #0f172a;">User</span>
            <span id="activeUserBadge" style="font-size: 10.5px; font-weight: 700; background: #e0f2fe; color: #0369a1; padding: 1px 7px; border-radius: 999px;">@user</span>
          </div>
        </div>

        <!-- Password Field -->
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <label for="passwordInput" style="font-size: 12px; font-weight: 700; color: #334155;">Password</label>
          <div class="input-wrapper">
            <input type="password" id="passwordInput" class="text-input" placeholder="Enter password" autocomplete="current-password" onkeydown="handleKey(event)">
            <button type="button" class="eye-toggle-btn" id="eyeToggleBtn" onclick="togglePasswordVisibility()" title="Show password" aria-label="Show password">
              <img id="eyeIcon" src="icons/eye.svg" alt="" width="18" height="18">
            </button>
          </div>
        </div>

        <!-- Sign In Action Button -->
        <button type="button" id="signInBtn" class="primary-btn" onclick="attemptSignIn()">
          <span>Sign in</span>
        </button>

        <!-- Feedback & Info Message -->
        <div id="feedbackMsg" class="feedback-msg">Press Enter or click Sign in</div>
      </div>

      <!-- Bottom Bar: Live Time and Power Options -->
      <div style="height: 36px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #d5d5d5; padding-top: 6px;">
        <!-- Window Clock -->
        <div style="display: flex; align-items: center; gap: 6px; padding: 0 4px; color: #334155;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span id="windowClock" style="font-size: 12.5px; font-weight: 700;">14:30</span>
        </div>

        <span style="flex: 1"></span>

        <!-- Restart Button -->
        <button type="button" class="beos-btn" onclick="showToast('System Restart requested')">
          <img src="icons/restart.svg" alt="" width="14" height="14">
          <span>Restart</span>
        </button>

        <!-- Shut down Button -->
        <button type="button" class="beos-btn" onclick="showToast('System Shut down requested')">
          <img src="icons/power.svg" alt="" width="14" height="14">
          <span>Shut down</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Toast for Power Actions -->
  <div id="actionToast" class="action-toast">
    <span id="toastText">Action initiated</span>
  </div>
</div>

<script>
let currentAccount = 'user';
let isPasswordVisible = false;

function updateClocks() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const timeString = `${hours}:${minutes}`;
  
  const deskbarClock = document.getElementById('deskbarClock');
  const windowClock = document.getElementById('windowClock');
  if (deskbarClock) deskbarClock.textContent = timeString;
  if (windowClock) windowClock.textContent = timeString;
}

setInterval(updateClocks, 1000);
updateClocks();

function selectUser(login, displayName, role, cardId) {
  currentAccount = login;
  document.querySelectorAll('.user-option').forEach(el => el.classList.remove('active'));
  document.getElementById(cardId).classList.add('active');
  
  document.getElementById('activeUserName').textContent = displayName;
  const badge = document.getElementById('activeUserBadge');
  badge.textContent = '@' + login;
  
  const pwInput = document.getElementById('passwordInput');
  pwInput.value = '';
  pwInput.focus();
  
  const feedback = document.getElementById('feedbackMsg');
  feedback.className = 'feedback-msg';
  feedback.textContent = `Ready to sign in as ${displayName}`;
}

function togglePasswordVisibility() {
  const pwInput = document.getElementById('passwordInput');
  const eyeIcon = document.getElementById('eyeIcon');
  isPasswordVisible = !isPasswordVisible;
  
  if (isPasswordVisible) {
    pwInput.type = 'text';
    eyeIcon.src = 'icons/eye-off.svg';
    document.getElementById('eyeToggleBtn').title = 'Hide password';
  } else {
    pwInput.type = 'password';
    eyeIcon.src = 'icons/eye.svg';
    document.getElementById('eyeToggleBtn').title = 'Show password';
  }
}

function handleKey(e) {
  if (e.key === 'Enter') {
    attemptSignIn();
  }
}

function attemptSignIn() {
  const pwInput = document.getElementById('passwordInput');
  const feedback = document.getElementById('feedbackMsg');
  const signInBtn = document.getElementById('signInBtn');
  const val = pwInput.value.trim();
  
  if (!val) {
    feedback.className = 'feedback-msg error';
    feedback.textContent = 'Please enter your password.';
    pwInput.focus();
    return;
  }
  
  // Simulated authentication
  signInBtn.disabled = true;
  signInBtn.style.opacity = '0.7';
  feedback.className = 'feedback-msg';
  feedback.textContent = 'Verifying credentials...';
  
  setTimeout(() => {
    signInBtn.disabled = false;
    signInBtn.style.opacity = '1';
    feedback.className = 'feedback-msg success';
    feedback.textContent = `Welcome, ${currentAccount}! Launching desktop session...`;
    
    showToast(`Signing in as ${currentAccount}...`);
  }, 600);
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('actionToast');
  const text = document.getElementById('toastText');
  text.textContent = msg;
  toast.style.display = 'inline-flex';
  
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.style.display = 'none';
  }, 2400);
}
</script>

</body>
</html>
