#
# Loaded from the directory of BOOTX64.EFI. The black banner lives in the
# theme file. The R5 entry starts the Haiku loader, which loads the kernel.

timeout 5
default_selection "R5"
scanfor manual,internal,external
dont_scan_dirs EFI/haiku
showtools shutdown,reboot
hideui hints
icons_dir icons
include themes/r5-black/theme.conf

menuentry "R5" {
	loader EFI/haiku/haiku_loader.efi
	icon EFI/BOOT/icons/os_haiku.png
}
